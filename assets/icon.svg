<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- 背景の微細なグラデーション -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2326"/>
      <stop offset="100%" stop-color="#0F1923"/>
    </linearGradient>
    
    <!-- 録画ボタンの発光エフェクト -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- アプリアイコンのベース（角丸） -->
  <rect width="256" height="256" rx="56" fill="url(#bg-grad)"/>
  
  <!-- VALORANT風のシャープなV字ロゴ -->
  <g transform="translate(0, -15)">
    <polygon points="115,165 50,80 90,80 135,138" fill="#FF4655"/>
    <polygon points="145,165 160,145 205,80 165,80" fill="#FF4655"/>
  </g>
  
  <!-- モダンなRECインジケーター -->
  <g transform="translate(128, 195)">
    <!-- 外側のパルス（波紋） -->
    <circle r="22" fill="none" stroke="#FF4655" stroke-width="3" opacity="0.4"/>
    <!-- 中央の録画ドット（発光） -->
    <circle r="12" fill="#FF4655" filter="url(#glow)"/>
  </g>
</svg>
